services:
  db:
    image: postgres:16-alpine
    container_name: nanosafety_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nanosafety
      POSTGRES_PASSWORD: nanosafety_secret
      POSTGRES_DB: nanosafety
    ports:
      - "5432:5432"
    volumes:
      - nanosafety_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nanosafety -d nanosafety"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nanosafety_pgdata:
